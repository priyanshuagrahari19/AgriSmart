<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriSmart - Address</title>
  <link rel="stylesheet" href="address.css">
 <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
</head>
<body>
  

<div class="navbar-container">
  <div class="wrapper">
    <header class="header">
      <!-- Logo -->
      <div class="logo">
        <a href="../mai/inde.html">
          <img src="../logo1.jpg" alt="AgriSmart Logo" onerror="this.src='/logo1.jpg'" style="height: 50px; width: auto; object-fit: contain; border-radius: 6px;" />
        </a>
      </div>

      <!-- Navigation Menu -->
      <nav class="navbar">
        <ul>
          <li>
            <a href="/mai/inde.html" class="active">
              <i class="fas fa-home"></i><span>Home</span>
            </a>
          </li>
          <li>
            <a href="/Description/description.html">
              <i class="fas fa-circle-info"></i><span>Description</span>
            </a>
          </li>

          <li>
            <a href="/marketplace/marketplace.html">
              <i class="fas fa-store"></i><span>Marketplace</span>
            </a>
          </li>
          <li>
            <a href="/SIH Website/expert.html">
              <i class="fas fa-user"></i><span>Expert</span>
            </a>
          </li>
          <li>
            <a href="/category/category.html">
              <i class="fas fa-flask"></i><span>Resources</span>
            </a>
          </li>
          <li>
            <a href="/environment/environment.html">
              <i class="fas fa-seedling"></i><span>Environment</span>
            </a>
          </li>
        </ul>
      </nav>

      <!-- Search -->
      <div class="search">
        <input type="text" class="search_box" placeholder="Search" />
        <i class="fas fa-search search_icon"></i>
      </div>

      <!-- User Profile Icons -->
      <div class="user-profile">
        <a href="#"><i class="fas fa-comment-dots"></i></a>
        <a href="#"><i class="fas fa-globe"></i></a>
        <a href="#"><i class="fas fa-user-circle"></i></a>
      </div>
    </header>
  </div>
</div>


  <!-- Main Container -->
  <main class="container">
    <h2>Enter Address</h2>
    <form class="address-form" onsubmit="event.preventDefault(); requestVisit();">
      <div class="form-group">
        <input type="text" id="fullname" placeholder="Full Name" required>
      </div>
      <div class="form-group">
        <input type="tel" id="phone" placeholder="Mobile Number" required>
      </div>
      <div class="form-group">
        <input type="text" id="pincode" placeholder="Pincode" required>
      </div>
      <div class="form-group">
        <input type="text" id="building" placeholder="Flat, House no., Building, Company, Apartment" required>
      </div>
      <div class="form-group">
        <input type="text" id="street" placeholder="Area, Street, Sector, Village" required>
      </div>
      <div class="form-group">
        <input type="text" id="landmark" placeholder="Landmark (Optional)">
      </div>
      <div class="form-group half">
        <input type="text" id="city" placeholder="Town/City" required>
        <input type="text" id="state" placeholder="State" required>
      </div>
      <div class="form-actions">
        <button type="submit">Save and Deliver Here</button>
      </div>
    </form>
  </main>

  <script>
    async function requestVisit() {
      const userStr = localStorage.getItem('user');
      const user = userStr ? JSON.parse(userStr) : null;
      const farmerId = user ? user.id : null;

      if (!farmerId) {
        alert("Please log in to request a visit.");
        window.location.href = "/login.html";
        return;
      }

      const fullname = document.getElementById("fullname").value;
      const phone = document.getElementById("phone").value;
      const pincode = document.getElementById("pincode").value;
      const building = document.getElementById("building").value;
      const street = document.getElementById("street").value;
      const landmark = document.getElementById("landmark").value;
      const city = document.getElementById("city").value;
      const state = document.getElementById("state").value;

      const addressString = `${building}, ${street}, Landmark: ${landmark || 'None'}, ${city}, ${state} - ${pincode}`;
      const scheduledAt = new Date(Date.now() + 3 * 24 * 60 * 60 * 1000).toISOString().slice(0, 10); // 3 days from now
      
      try {
        const res = await fetch("/api/consultations", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            farmerId,
            expertId: 1, // Default expert
            consultationType: "site_visit",
            scheduledAt,
            notes: `Request from ${fullname} (Phone: ${phone})`,
            shippingAddress: addressString
          })
        });

        const data = await res.json();
        if (res.ok) {
          alert(`Expert visit requested successfully!\nBooking ID: ${data.bookingId}\nScheduled Date: ${scheduledAt}\nAn expert will contact you shortly.`);
          window.location.href = "expert.html";
        } else {
          alert("Error: " + (data.error || "Failed to book visit"));
        }
      } catch (err) {
        console.error(err);
        alert("Server error. Check backend connection.");
      }
    }
  </script>
</body>
</html>
