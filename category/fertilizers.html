  </div>
  <h1 style="text-align:center; color:#2d572c;">Fertilizers</h1>

  <div class="image-gallery" id="gallery">
    <div style="text-align: center; width: 100%; grid-column: span 3; padding: 40px 0;">
      <i class="fas fa-spinner fa-spin" style="font-size: 30px; color: #388e3c;"></i>
      <p style="margin-top: 10px;">Loading fertilizers...</p>
    </div>
  </div>

  <script>
    async function loadProducts() {
      try {
        const res = await fetch('/api/products?category=fertilizers');
        const products = await res.json();
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = '';
        
        if (products.length === 0) {
          gallery.innerHTML = '<p style="text-align:center; grid-column: span 3;">No fertilizer products available currently.</p>';
          return;
        }

        products.forEach(p => {
          gallery.innerHTML += `
            <div class="card">
              <a href="detail.html?id=${p.id}">
                <img src="${p.image_url}" alt="${p.name}">
                <div class="caption">${p.name}<br><span style="color:#e65100; font-size:14px;">₹${p.price}</span></div>
              </a>
            </div>
          `;
        });
      } catch (err) {
        console.error(err);
        document.getElementById('gallery').innerHTML = '<p style="text-align:center; grid-column: span 3; color:red;">Failed to load products. Make sure server is running.</p>';
      }
    }
    loadProducts();
  </script>
</body>
