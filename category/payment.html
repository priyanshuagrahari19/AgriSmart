<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Page</title>
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 <link rel="stylesheet" href="payement.css">
</head>
<body>
  

<div class="navbar-container">
  <div class="wrapper">
    <header class="header">
      <!-- Logo -->
      <div class="logo">
        <a href="../mai/inde.html">
          <img src="../logo1.jpg" alt="AgriSmart Logo" onerror="this.src='/logo1.jpg'" style="height: 50px; width: auto; object-fit: contain; border-radius: 6px;" />
        </a>
      </div>

      <!-- Navigation Menu -->
      <nav class="navbar">
        <ul>
          <li>
            <a href="/mai/inde.html" class="active">
              <i class="fas fa-home"></i><span>Home</span>
            </a>
          </li>
          <li>
            <a href="/Description/description.html">
              <i class="fas fa-circle-info"></i><span>Description</span>
            </a>
          </li>

          <li>
            <a href="/marketplace/marketplace.html">
              <i class="fas fa-store"></i><span>Marketplace</span>
            </a>
          </li>
          <li>
            <a href="/SIH Website/expert.html">
              <i class="fas fa-user"></i><span>Expert</span>
            </a>
          </li>
          <li>
            <a href="/category/category.html">
              <i class="fas fa-flask"></i><span>Resources</span>
            </a>
          </li>
          <li>
            <a href="/environment/environment.html">
              <i class="fas fa-seedling"></i><span>Environment</span>
            </a>
          </li>
        </ul>
      </nav>

      <!-- Search -->
      <div class="search">
        <input type="text" class="search_box" placeholder="Search" />
        <i class="fas fa-search search_icon"></i>
      </div>

      <!-- User Profile Icons -->
      <div class="user-profile">
        <a href="#"><i class="fas fa-comment-dots"></i></a>
        <a href="#"><i class="fas fa-globe"></i></a>
        <a href="#"><i class="fas fa-user-circle"></i></a>
      </div>
    </header>
  </div>
</div>


  <div class="container">
    <h1>Payment Options</h1>

    <div class="tabs">
      <div class="tab active" data-tab="card">Card</div>
      <div class="tab" data-tab="upi">UPI</div>
      <div class="tab" data-tab="netbanking">Net Banking</div>
      <div class="tab" data-tab="cod">Cash on Delivery</div>
    </div>

    <!-- Card Payment -->
    <div class="tab-content active" id="card">
      <form onsubmit="event.preventDefault(); processOrder('card')">
        <label for="cardname">Cardholder Name</label>
        <input type="text" id="cardname" placeholder="John Doe" required>

        <label for="cardnumber">Card Number</label>
        <input type="text" id="cardnumber" placeholder="XXXX-XXXX-XXXX-XXXX" required>

        <label for="expiry">Expiry Date</label>
        <input type="month" id="expiry" required>

        <label for="cvv">CVV</label>
        <input type="password" id="cvv" placeholder="XXX" required>

        <button type="submit">Pay Now</button>
      </form>
    </div>

    <!-- UPI Payment -->
    <div class="tab-content" id="upi">
      <form onsubmit="event.preventDefault(); processOrder('upi')">
        <label for="upiid">Enter UPI ID</label>
        <input type="text" id="upiid" placeholder="example@upi" required>
        <button type="submit">Pay via UPI</button>
      </form>
    </div>

    <!-- Net Banking -->
    <div class="tab-content" id="netbanking">
      <form onsubmit="event.preventDefault(); processOrder('netbanking')">
        <label for="bank">Select Bank</label>
        <select id="bank" required>
          <option value="">--Select Bank--</option>
          <option>State Bank of India</option>
          <option>HDFC Bank</option>
          <option>ICICI Bank</option>
          <option>Axis Bank</option>
          <option>Punjab National Bank</option>
        </select>
        <button type="submit">Pay via Net Banking</button>
      </form>
    </div>

    <!-- Cash on Delivery -->
    <div class="tab-content" id="cod">
      <p>Pay with cash when your order is delivered. Please ensure you have the exact amount ready.</p>
      <button onclick="processOrder('cod')">Confirm COD</button>
    </div>
  </div>

  <script>
    // Tab switching logic
    const tabs = document.querySelectorAll('.tab');
    const contents = document.querySelectorAll('.tab-content');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        contents.forEach(content => content.classList.remove('active'));
        document.getElementById(tab.dataset.tab).classList.add('active');
      });
    });

    async function processOrder(paymentMethod) {
      const userStr = localStorage.getItem('user');
      const addressStr = localStorage.getItem('shippingAddress');
      const checkoutItemStr = localStorage.getItem('checkoutItem');

      if (!addressStr || !checkoutItemStr) {
        alert("Missing cart or delivery details. Please re-try from the product page.");
        window.location.href = "category.html";
        return;
      }

      const user = userStr ? JSON.parse(userStr) : {};
      const address = JSON.parse(addressStr);
      const checkoutItem = JSON.parse(checkoutItemStr);

      const payload = {
        userId: user.id || null,
        totalAmount: checkoutItem.price * checkoutItem.quantity,
        shippingName: address.name,
        shippingPhone: address.phone,
        shippingAddress: address.address,
        shippingCity: address.city,
        shippingState: address.state,
        shippingPincode: address.pincode,
        paymentMethod: paymentMethod,
        items: [
          {
            productId: checkoutItem.productId,
            quantity: checkoutItem.quantity,
            unitPrice: checkoutItem.price
          }
        ]
      };

      try {
        const res = await fetch("/api/orders", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (res.ok) {
          alert(`Order placed successfully!\nTransaction ID: ${data.transactionId}\nOrder ID: ${data.orderId}`);
          localStorage.removeItem('checkoutItem');
          window.location.href = "/mai/inde.html";
        } else {
          alert("Error placing order: " + (data.error || "Please try again."));
        }
      } catch (err) {
        console.error(err);
        alert("Failed to connect to the server. Please verify the backend is running.");
      }
    }
  </script>
</body>
</html>
